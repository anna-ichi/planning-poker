<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Layout: mobile-first single column. Room order = status banner → issue → your cards → table → results. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --surface-2: #e8ece6;
  --fg: #1c2420;
  --muted: #647069;
  --line: #d2d9d1;
  --accent: #0f6e56;
  --accent-fg: #ffffff;
  --accent-soft: #d8ede4;
  --warn: #b25f00;
  --warn-soft: #fbe9d2;
  --danger: #a73a2b;
  --felt: #1f5a46;
  --felt-fg: #e8f3ee;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "Roboto Mono", "SF Mono", Menlo, Consolas, monospace;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(20,30,25,.08), 0 6px 20px rgba(20,30,25,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131816; --surface: #1c2320; --surface-2: #252e2a; --fg: #e9eeeb; --muted: #94a09a;
    --line: #313c36; --accent: #4fb995; --accent-fg: #0d1a15; --accent-soft: #1e3a30;
    --warn: #e5a04a; --warn-soft: #3a2a14; --danger: #e07a6c; --felt: #19423a; --felt-fg: #d9ebe3;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131816; --surface: #1c2320; --surface-2: #252e2a; --fg: #e9eeeb; --muted: #94a09a;
  --line: #313c36; --accent: #4fb995; --accent-fg: #0d1a15; --accent-soft: #1e3a30;
  --warn: #e5a04a; --warn-soft: #3a2a14; --danger: #e07a6c; --felt: #19423a; --felt-fg: #d9ebe3;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) max(24px, env(safe-area-inset-bottom, 0px));
}
.app { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding-top: 14px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.3; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 16px; font-weight: 500; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn-big { width: 100%; padding: 14px 16px; font-size: 16px; }
input[type=text], select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0; font-size: 16px; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); }
.error { color: var(--danger); font-size: 13px; min-height: 1.2em; }
label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 14px; }

/* header */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 28px; height: 38px; border-radius: 5px; background: var(--felt); color: var(--felt-fg); display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 16px; box-shadow: var(--shadow); }
.brand h1 { font-size: 17px; }

/* room bar */
.roombar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.roombar .code { font-family: var(--font-mono); font-weight: 700; letter-spacing: .12em; font-size: 18px; }
.roombar .lbl { font-size: 13px; color: var(--muted); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); display: inline-block; flex: none; }
.status-dot.on { background: var(--accent); }
.roombar .spacer { flex: 1; }

/* lobby */
.lobby { display: flex; flex-direction: column; gap: 16px; }
.lobby h2 { font-size: 17px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 600px) { .choice { grid-template-columns: 1fr; } }
.joinbox { border-color: var(--accent); }
.joinbox .code { font-size: 26px; letter-spacing: .18em; }

/* status banner */
.banner { border-radius: var(--radius); padding: 14px 16px; display: flex; gap: 12px; align-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 16px; }
.banner.wait { background: var(--surface-2); color: var(--fg); }
.banner.done { background: var(--felt); color: var(--felt-fg); }
.banner .step { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: currentColor; }
.banner .step span { color: var(--surface); font-family: var(--font-mono); font-size: 14px; }
.banner .txt { flex: 1; min-width: 0; }
.banner .sub { display: block; font-weight: 400; font-size: 13px; opacity: .85; }

/* issue */
.issue-view { font-size: 18px; font-weight: 700; padding: 4px 0; min-height: 1.4em; overflow-wrap: anywhere; }
.issue-view.empty { color: var(--muted); font-weight: 500; }
.issue-edit { display: flex; gap: 8px; }
.issue-edit input { flex: 1; }

/* hand */
.hand { border-color: var(--accent); }
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 10px; }
.hcard { aspect-ratio: 5 / 7; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-family: var(--font-mono); font-weight: 700; font-size: 22px; display: grid; place-items: center; box-shadow: var(--shadow); transition: transform .12s, border-color .12s; padding: 0; }
.hcard:hover { transform: translateY(-3px); border-color: var(--accent); }
.hcard.selected { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); transform: translateY(-6px); }
.hcard:disabled { transform: none; box-shadow: none; }
.hand-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mychoice { font-size: 14px; }
.mychoice b { font-family: var(--font-mono); font-size: 18px; color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .hcard { transition: none; } }

/* table */
.table { background: var(--felt); color: var(--felt-fg); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.table .eyebrow { color: var(--felt-fg); opacity: .75; }
.seats { display: flex; flex-wrap: wrap; gap: 12px 10px; }
.seat { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 76px; }
.seat .name { font-size: 12px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; line-height: 1.3; }
.seat .name.me { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.seat .tag { font-size: 10px; opacity: .8; }
.pcard { width: 50px; height: 70px; border-radius: 7px; display: grid; place-items: center; font-family: var(--font-mono); font-weight: 700; font-size: 20px; border: 2px dashed rgba(255,255,255,.35); transition: transform .25s, background .25s; }
.pcard .lbl { font-family: var(--font-body); font-size: 11px; font-weight: 500; opacity: .7; }
.pcard.voted { background: repeating-linear-gradient(45deg, rgba(255,255,255,.25) 0 6px, rgba(255,255,255,.08) 6px 12px); border: 2px solid rgba(255,255,255,.8); }
.pcard.open { background: #fff; color: #1c2420; border: 2px solid #fff; }
.pcard.observer { border-style: dotted; opacity: .5; }
.table-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.table-actions button { background: rgba(255,255,255,.12); color: var(--felt-fg); border-color: rgba(255,255,255,.3); }
.table-actions button:hover { background: rgba(255,255,255,.22); }
.table-actions .btn-reveal { background: #fff; color: #1c2420; border-color: #fff; font-weight: 700; flex: 1 1 200px; padding: 14px; font-size: 16px; }
.table-actions .btn-reveal:hover { filter: brightness(.95); }
.table-actions .btn-next { background: #fff; color: #1c2420; border-color: #fff; font-weight: 700; flex: 1 1 200px; padding: 14px; font-size: 16px; }
.progress { font-size: 13px; opacity: .9; }
@media (prefers-reduced-motion: reduce) { .pcard { transition: none; } }

/* results */
.results { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 600px) { .results { grid-template-columns: 1fr; } }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .big { font-family: var(--font-mono); font-size: 32px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 24px; flex-wrap: wrap; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 44px 1fr 40px; gap: 10px; align-items: center; font-size: 13px; }
.bar .v { font-family: var(--font-mono); font-weight: 700; font-size: 16px; }
.bar .track { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.bar .who { grid-column: 2 / -1; color: var(--muted); font-size: 12px; margin-top: -6px; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; }
.pill.spread { background: var(--warn-soft); color: var(--warn); }

/* history */
.history-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.history-item:first-child { border-top: 0; padding-top: 0; }
.history-item .r { font-family: var(--font-mono); font-weight: 700; white-space: nowrap; }
.history-item .issue-t { overflow-wrap: anywhere; }
.history-item .detail { color: var(--muted); font-size: 12px; }

/* settings */
details.settings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 16px; }
details.settings summary { cursor: pointer; padding: 12px 0; font-weight: 700; font-size: 14px; list-style: none; display: flex; justify-content: space-between; }
details.settings summary::after { content: "＋"; color: var(--muted); }
details.settings[open] summary::after { content: "－"; }
details.settings .body { display: flex; flex-direction: column; gap: 14px; padding-bottom: 16px; }
label.check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
label.check input { width: 18px; height: 18px; }

/* notice / toast */
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.notice.danger { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; }
.linkbox { display: flex; gap: 8px; align-items: center; }
.linkbox input { font-family: var(--font-mono); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">?</div>
      <div>
        <h1>Planning Poker</h1>
        <div class="hint">ログイン不要・同じリンクを開いた人同士でつながります</div>
      </div>
    </div>
  </header>

  <!-- ===== Lobby ===== -->
  <section id="lobby" class="lobby">
    <div class="card">
      <label class="field" for="nameInput">1. あなたの名前（他の人に表示されます）
        <input id="nameInput" type="text" placeholder="例: いちむら" maxlength="20" autocomplete="nickname">
      </label>
    </div>

    <!-- joining from a link: only the join box is shown -->
    <div id="joinFromLink" class="card joinbox" hidden>
      <h2>2. この部屋に参加する</h2>
      <div class="row"><span class="hint">部屋コード</span><span id="joinFromLinkCode" class="mono code"></span></div>
      <button id="joinLinkBtn" class="btn-primary btn-big">参加する</button>
      <div id="joinLinkError" class="error" role="alert"></div>
      <button id="showChoicesBtn" class="btn-ghost btn-sm" style="align-self:flex-start">別の部屋を作る / 別のコードで入る</button>
    </div>

    <div id="choices" class="choice">
      <div class="card">
        <h2>2a. 新しい部屋を作る</h2>
        <p class="hint">見積もり会を始める人はこちら。作った後に出るリンクをチームに送ります。</p>
        <label class="field" for="deckSelect">カードの種類
          <select id="deckSelect"></select>
        </label>
        <button id="createBtn" class="btn-primary btn-big">部屋を作る</button>
      </div>
      <div class="card">
        <h2>2b. 部屋に入る</h2>
        <p class="hint">送られてきた部屋コード（5文字）を入力します。</p>
        <input id="joinCode" type="text" placeholder="例: K7P3Q" maxlength="8" autocapitalize="characters" class="mono" style="letter-spacing:.15em">
        <button id="joinBtn" class="btn-big">入る</button>
        <div id="lobbyError" class="error" role="alert"></div>
      </div>
    </div>
  </section>

  <!-- ===== Room ===== -->
  <section id="room" hidden style="display:flex; flex-direction:column; gap:16px">
    <div class="roombar">
      <span id="statusDot" class="status-dot" title="接続状態"></span>
      <span class="lbl">部屋</span><span id="roomCodeView" class="code"></span>
      <span class="spacer"></span>
      <button id="copyLink" class="btn-sm btn-primary">招待リンクをコピー</button>
      <button id="leaveBtn" class="btn-sm btn-ghost">退出</button>
    </div>
    <div id="notice" class="notice" hidden></div>

    <div id="banner" class="banner">
      <div class="step"><span id="bannerStep">1</span></div>
      <div class="txt"><span id="bannerMain"></span><span id="bannerSub" class="sub"></span></div>
    </div>

    <div class="card">
      <div class="row between">
        <span class="eyebrow">いま見積もっているもの</span>
        <button id="issueEditBtn" class="btn-sm btn-ghost">編集</button>
      </div>
      <div id="issueView" class="issue-view empty">（未入力）例: PBI-42 ログイン画面の改修</div>
      <div id="issueEdit" class="issue-edit" hidden>
        <input id="issueInput" type="text" placeholder="チケット番号やタイトル" maxlength="140">
        <button id="issueSaveBtn" class="btn-primary">保存</button>
      </div>
    </div>

    <div id="handSection" class="card hand">
      <span class="eyebrow">あなたのカード — タップして選ぶ</span>
      <div id="deck" class="deck"></div>
      <div class="hand-foot">
        <span id="myChoice" class="mychoice"></span>
        <span id="handHint" class="hint"></span>
      </div>
    </div>

    <div class="table">
      <div class="row between">
        <span class="eyebrow">テーブル</span>
        <span id="progress" class="progress"></span>
      </div>
      <div id="seats" class="seats"></div>
      <div class="table-actions">
        <button id="revealBtn" class="btn-reveal">カードをオープン</button>
        <button id="resetBtn" class="btn-next" hidden>次の見積もりへ</button>
        <button id="redoBtn" class="btn-sm" hidden>投票をやり直す</button>
      </div>
    </div>

    <div id="resultsSection" class="results" hidden>
      <div class="card">
        <span class="eyebrow">結果</span>
        <div class="stats">
          <div class="stat"><span class="hint">平均</span><span id="statAvg" class="big">–</span></div>
          <div class="stat"><span class="hint">中央値</span><span id="statMed" class="big">–</span></div>
          <div class="stat"><span class="hint">最多</span><span id="statMode" class="big">–</span></div>
        </div>
        <div id="consensus"></div>
      </div>
      <div class="card">
        <span class="eyebrow">誰が何を出したか</span>
        <div id="bars" class="bars"></div>
      </div>
    </div>

    <div class="card" id="historyCard" hidden>
      <span class="eyebrow">これまでの見積もり</span>
      <div id="history"></div>
    </div>

    <details class="settings">
      <summary>設定（見学モード・カードの種類）</summary>
      <div class="body">
        <label class="check"><input type="checkbox" id="observerToggle"> 見学する（投票に参加しない。ファシリテーターやPO向け）</label>
        <label class="field" for="deckSelectRoom">カードの種類（変えると進行中の投票はリセットされます）
          <select id="deckSelectRoom"></select>
        </label>
        <div class="linkbox">
          <input id="linkView" type="text" readonly>
          <button id="copyLink2" class="btn-sm">コピー</button>
        </div>
      </div>
    </details>
  </section>
</div>
<div id="toast" class="toast" role="status"></div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const DECKS = {
    fib:   { label: 'フィボナッチ (0 1 2 3 5 8 13 21 ? ☕)', cards: ['0','1','2','3','5','8','13','21','?','☕'] },
    mfib:  { label: '修正フィボナッチ (0 ½ 1 2 3 5 8 13 20 40 100 ? ☕)', cards: ['0','½','1','2','3','5','8','13','20','40','100','?','☕'] },
    tshirt:{ label: 'Tシャツ (XS S M L XL XXL ?)', cards: ['XS','S','M','L','XL','XXL','?'] },
    pow2:  { label: '2のべき乗 (1 2 4 8 16 32 ?)', cards: ['1','2','4','8','16','32','?'] },
  };
  const PREFIX = 'pp-room-';
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';

  let peer = null, hostConn = null, conns = new Map();
  let isHost = false, roomCode = '', myId = '', myName = '';
  let view = null;   // rendered state (host builds, clients receive)
  let S = null;      // host-only authoritative state
  let myVoteLocal = null;

  const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200); };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const genCode = () => Array.from({ length: 5 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
  const normCode = (c) => (c || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  const linkFor = (code) => location.href.split('#')[0] + '#' + code;
  const numOf = (v) => { if (v === '½') return 0.5; const n = Number(v); return Number.isFinite(n) ? n : null; };
  const fmt = (n) => (Math.round(n * 10) / 10).toString();
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  for (const sel of [$('deckSelect'), $('deckSelectRoom')]) for (const [k, d] of Object.entries(DECKS)) sel.append(new Option(d.label, k));
  $('nameInput').value = store.get('pp-name') || '';

  // ---------- host ----------
  function hostInit(deckKey) {
    S = { issue: '', deck: deckKey, revealed: false, participants: {}, history: [], round: 1 };
    S.participants[myId] = { name: myName, vote: null, observer: false, order: 0 };
  }
  function hostApply(from, msg) {
    const p = S.participants[from];
    switch (msg.type) {
      case 'join': S.participants[from] = { name: String(msg.name || '名無し').slice(0, 20), vote: null, observer: false, order: Object.keys(S.participants).length }; break;
      case 'leave': delete S.participants[from]; break;
      case 'vote': if (p && !p.observer && !S.revealed) p.vote = (p.vote === msg.value) ? null : String(msg.value).slice(0, 8); break;
      case 'observer': if (p) { p.observer = !!msg.value; if (p.observer) p.vote = null; } break;
      case 'issue': S.issue = String(msg.value || '').slice(0, 140); break;
      case 'reveal': if (Object.values(S.participants).some(q => !q.observer && q.vote != null)) S.revealed = true; break;
      case 'redo': S.revealed = false; for (const q of Object.values(S.participants)) q.vote = null; break;
      case 'reset': {
        if (S.revealed) {
          const votes = Object.values(S.participants).filter(q => !q.observer && q.vote != null).map(q => q.vote);
          S.history.unshift({ round: S.round, issue: S.issue, summary: summarize(votes) });
          S.history = S.history.slice(0, 20); S.round++; S.issue = '';
        }
        S.revealed = false; for (const q of Object.values(S.participants)) q.vote = null;
        break;
      }
      case 'deck': if (DECKS[msg.value]) { S.deck = msg.value; S.revealed = false; for (const q of Object.values(S.participants)) q.vote = null; } break;
    }
    broadcast();
  }
  function buildView() {
    const parts = {};
    for (const [id, q] of Object.entries(S.participants)) parts[id] = { name: q.name, observer: q.observer, voted: q.vote != null, vote: S.revealed ? q.vote : null, order: q.order };
    return { issue: S.issue, deck: S.deck, revealed: S.revealed, participants: parts, history: S.history, round: S.round, hostId: myId };
  }
  function broadcast() {
    view = buildView();
    const payload = { type: 'state', view };
    for (const c of conns.values()) if (c.open) { try { c.send(payload); } catch {} }
    render();
  }
  function summarize(votes) {
    const nums = votes.map(numOf).filter(n => n != null);
    const counts = {}; for (const v of votes) counts[v] = (counts[v] || 0) + 1;
    const mode = Object.entries(counts).sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(b[0]))[0]?.[0] ?? '–';
    let avg = null, med = null;
    if (nums.length) { avg = nums.reduce((a, b) => a + b, 0) / nums.length; const s = [...nums].sort((a, b) => a - b); med = s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2; }
    return { counts, mode, avg, med, n: votes.length, consensus: votes.length > 1 && Object.keys(counts).length === 1 };
  }
  function act(msg) {
    if (isHost) hostApply(myId, msg);
    else if (hostConn && hostConn.open) hostConn.send(msg);
    else toast('ホストに接続していません');
  }

  // ---------- connection ----------
  function setStatus(on) { $('statusDot').classList.toggle('on', on); $('statusDot').title = on ? '接続中' : '未接続'; }
  function showNotice(text, danger) { const n = $('notice'); n.hidden = !text; n.textContent = text || ''; n.classList.toggle('danger', !!danger); }
  function requireName(errEl) {
    myName = $('nameInput').value.trim().slice(0, 20);
    if (!myName) { errEl.textContent = '先に名前を入力してください'; $('nameInput').focus(); return false; }
    store.set('pp-name', myName); errEl.textContent = ''; return true;
  }
  function setBusy(btn, busy, label) { btn.disabled = busy; btn.textContent = busy ? '接続中…' : label; }

  function createRoom() {
    if (!requireName($('lobbyError'))) return;
    const code = genCode();
    setBusy($('createBtn'), true, '部屋を作る');
    peer = new Peer(PREFIX + code.toLowerCase(), { debug: 1 });
    peer.on('open', (id) => {
      myId = id; isHost = true; roomCode = code;
      hostInit($('deckSelect').value);
      enterRoom(); broadcast(); setStatus(true);
      toast('部屋ができました。「招待リンクをコピー」で共有してください');
    });
    peer.on('connection', (conn) => {
      conns.set(conn.peer, conn);
      conn.on('data', (msg) => { if (msg && typeof msg === 'object') hostApply(conn.peer, msg); });
      conn.on('close', () => { conns.delete(conn.peer); if (S && S.participants[conn.peer]) { delete S.participants[conn.peer]; broadcast(); } });
      conn.on('error', () => {});
    });
    peer.on('error', (e) => { if (e.type === 'unavailable-id') { peer.destroy(); createRoom(); return; } lobbyFail(e, $('lobbyError')); });
    peer.on('disconnected', () => { setStatus(false); try { peer.reconnect(); } catch {} });
  }

  function joinRoom(code, errEl, btn) {
    code = normCode(code);
    if (!code) { errEl.textContent = '部屋コードを入力してください'; return; }
    if (!requireName(errEl)) return;
    const label = btn.textContent; setBusy(btn, true, label);
    peer = new Peer({ debug: 1 });
    peer.on('open', (id) => {
      myId = id;
      hostConn = peer.connect(PREFIX + code.toLowerCase(), { reliable: true });
      const timeout = setTimeout(() => { if (!hostConn.open) lobbyFail({ type: 'timeout' }, errEl, btn, label); }, 12000);
      hostConn.on('open', () => { clearTimeout(timeout); isHost = false; roomCode = code; hostConn.send({ type: 'join', name: myName }); enterRoom(); setStatus(true); });
      hostConn.on('data', (msg) => { if (msg && msg.type === 'state') { view = msg.view; render(); } });
      hostConn.on('close', () => { setStatus(false); showNotice('ホストとの接続が切れました。ホストが退出したか、ホストの端末がスリープした可能性があります。ホストに部屋を開き直してもらうか、新しい部屋を作ってください。', true); });
      hostConn.on('error', () => {});
    });
    peer.on('error', (e) => lobbyFail(e, errEl, btn, label));
    peer.on('disconnected', () => { setStatus(false); try { peer.reconnect(); } catch {} });
  }

  function lobbyFail(e, errEl, btn, label) {
    const t = e && e.type;
    const msgs = {
      'peer-unavailable': 'この部屋コードの部屋が見つかりません。ホストがページを開いたままか確認してください（ホストの画面が閉じたりスリープすると部屋は消えます）。',
      'network': '接続サーバーに届きません。ネットワーク（VPNやファイアウォール）を確認してください。',
      'timeout': '接続がタイムアウトしました。ネットワークがWebRTCを遮断している可能性があります。',
      'browser-incompatible': 'このブラウザはWebRTCに対応していません。',
    };
    errEl.textContent = msgs[t] || ('接続エラー: ' + (t || e));
    setBusy($('createBtn'), false, '部屋を作る');
    setBusy($('joinBtn'), false, '入る');
    setBusy($('joinLinkBtn'), false, '参加する');
    if (peer && $('room').hidden) { try { peer.destroy(); } catch {} peer = null; }
  }

  function enterRoom() {
    $('lobby').hidden = true; $('room').hidden = false;
    $('roomCodeView').textContent = roomCode;
    $('linkView').value = linkFor(roomCode);
    history.replaceState(null, '', '#' + roomCode);
    document.title = `Planning Poker · ${roomCode}`;
    myVoteLocal = null;
  }
  function leaveRoom() {
    try { if (!isHost) act({ type: 'leave' }); } catch {}
    try { peer && peer.destroy(); } catch {}
    peer = null; hostConn = null; conns = new Map(); isHost = false; view = null; S = null;
    $('lobby').hidden = false; $('room').hidden = true;
    $('joinFromLink').hidden = true; $('choices').hidden = false;
    setBusy($('createBtn'), false, '部屋を作る'); setBusy($('joinBtn'), false, '入る'); setBusy($('joinLinkBtn'), false, '参加する');
    history.replaceState(null, '', location.pathname + location.search);
    document.title = 'Planning Poker'; showNotice('');
  }

  // ---------- render ----------
  function setBanner(step, cls, main, sub) {
    const b = $('banner'); b.className = 'banner ' + cls;
    $('bannerStep').textContent = step; $('bannerMain').textContent = main; $('bannerSub').textContent = sub || '';
  }
  function render() {
    if (!view) return;
    const me = view.participants[myId];
    const deck = DECKS[view.deck] || DECKS.fib;
    const list = Object.entries(view.participants).sort((a, b) => a[1].order - b[1].order);
    const voters = list.filter(([, p]) => !p.observer);
    const votedN = voters.filter(([, p]) => p.voted).length;
    const allIn = voters.length > 0 && votedN === voters.length;
    const alone = list.length === 1;

    // banner: tell the viewer exactly what to do now
    if (view.revealed) setBanner('3', 'done', '結果が出ました', '話し合って合意できたら「次の見積もりへ」。意見が割れたら「投票をやり直す」');
    else if (alone) setBanner('0', 'wait', 'まだあなただけです', '「招待リンクをコピー」してチームに送ってください');
    else if (me && me.observer) setBanner('–', 'wait', '見学モードです', '全員が選んだら「カードをオープン」を押せます');
    else if (!me || !me.voted) setBanner('1', '', 'カードを1枚選んでください', view.issue ? `対象: ${view.issue}` : '見積もる対象が未入力です。上の「編集」から入れると分かりやすくなります');
    else if (allIn) setBanner('2', '', '全員が選びました', '誰でも「カードをオープン」を押せます');
    else setBanner('2', 'wait', `あと ${voters.length - votedN} 人を待っています`, '選び直すにはカードをもう一度タップ');

    // issue
    if ($('issueEdit').hidden) { $('issueView').textContent = view.issue || '（未入力）例: PBI-42 ログイン画面の改修'; $('issueView').classList.toggle('empty', !view.issue); }

    // hand
    $('handSection').hidden = !!(me && me.observer);
    const d = $('deck'); d.replaceChildren();
    for (const v of deck.cards) {
      const b = el('button', 'hcard', v); b.type = 'button'; b.disabled = view.revealed;
      const mine = view.revealed ? (me && me.vote === v) : (myVoteLocal === v);
      if (mine) b.classList.add('selected');
      b.setAttribute('aria-pressed', mine ? 'true' : 'false');
      b.addEventListener('click', () => { myVoteLocal = (myVoteLocal === v) ? null : v; act({ type: 'vote', value: v }); render(); });
      d.append(b);
    }
    if (me && !me.voted && !view.revealed) myVoteLocal = null;
    const chosen = view.revealed ? (me && me.vote) : myVoteLocal;
    const mc = $('myChoice'); mc.replaceChildren();
    if (chosen) { mc.append('あなたの選択: '); mc.append(el('b', null, chosen)); }
    else mc.textContent = view.revealed ? '' : 'まだ選んでいません';
    $('handHint').textContent = view.revealed ? '' : (chosen ? 'もう一度タップで取り消し' : '');

    // seats
    const seats = $('seats'); seats.replaceChildren();
    for (const [id, p] of list) {
      const seat = el('div', 'seat');
      const c = el('div', 'pcard');
      if (p.observer) { c.classList.add('observer'); c.append(el('span', 'lbl', '見学')); }
      else if (view.revealed) { c.classList.add('open'); c.textContent = p.vote ?? '–'; }
      else if (p.voted) { c.classList.add('voted'); }
      else { c.append(el('span', 'lbl', '選択中')); }
      const n = el('div', 'name', p.name); if (id === myId) n.classList.add('me');
      n.title = p.name;
      seat.append(c, n);
      const tags = []; if (id === myId) tags.push('あなた'); if (id === view.hostId) tags.push('ホスト');
      if (tags.length) seat.append(el('div', 'tag', tags.join('・')));
      seats.append(seat);
    }
    $('progress').textContent = view.revealed ? `${view.round}回目 · オープン済み` : `${view.round}回目 · ${votedN} / ${voters.length} 人が選択済み`;

    // actions: show only what makes sense now
    $('revealBtn').hidden = view.revealed;
    $('revealBtn').disabled = votedN === 0;
    $('revealBtn').textContent = allIn ? 'カードをオープン ✓' : (votedN === 0 ? 'カードをオープン（まだ誰も選んでいません）' : `カードをオープン（${votedN}/${voters.length}）`);
    $('resetBtn').hidden = !view.revealed;
    $('redoBtn').hidden = !view.revealed;

    // results
    $('resultsSection').hidden = !view.revealed;
    if (view.revealed) {
      const votes = voters.map(([, p]) => p.vote).filter(v => v != null);
      const sm = summarize(votes);
      $('statAvg').textContent = sm.avg == null ? '–' : fmt(sm.avg);
      $('statMed').textContent = sm.med == null ? '–' : fmt(sm.med);
      $('statMode').textContent = sm.mode;
      const cons = $('consensus'); cons.replaceChildren();
      if (sm.consensus) cons.append(el('span', 'pill', '全員一致 🎉'));
      else if (sm.n > 1) {
        const nums = votes.map(numOf).filter(n => n != null);
        const wide = nums.length > 1 && deckDistance(deck, Math.min(...nums), Math.max(...nums)) >= 2;
        cons.append(el('span', 'pill' + (wide ? ' spread' : ''), wide ? 'ばらつき大 · 最高と最低の人に理由を聞いてみましょう' : 'ほぼ一致'));
      }
      const bars = $('bars'); bars.replaceChildren();
      const order = deck.cards.filter(c => sm.counts[c]).concat(Object.keys(sm.counts).filter(c => !deck.cards.includes(c)));
      for (const v of order) {
        const row = el('div', 'bar');
        const names = voters.filter(([, p]) => p.vote === v).map(([, p]) => p.name).join('、');
        row.append(el('span', 'v', v));
        const track = el('div', 'track'); const fill = el('div', 'fill'); fill.style.width = (sm.counts[v] / sm.n * 100) + '%'; track.append(fill); row.append(track);
        row.append(el('span', 'n', sm.counts[v] + '人'));
        row.append(el('span', 'who', names));
        bars.append(row);
      }
    }

    // history
    $('historyCard').hidden = !(view.history && view.history.length);
    const h = $('history'); h.replaceChildren();
    for (const item of (view.history || [])) {
      const it = el('div', 'history-item');
      const left = el('div'); left.append(el('div', 'issue-t', `${item.round}回目 ${item.issue || '（対象未入力）'}`));
      const parts = Object.entries(item.summary.counts).map(([v, n]) => `${v}×${n}`).join('  ');
      left.append(el('div', 'detail', `${item.summary.n}人 · ${parts}${item.summary.consensus ? ' · 全員一致' : ''}`));
      it.append(left, el('div', 'r', item.summary.avg == null ? item.summary.mode : `平均 ${fmt(item.summary.avg)}`));
      h.append(it);
    }
    $('observerToggle').checked = !!(me && me.observer);
    $('deckSelectRoom').value = view.deck;
  }
  function deckDistance(deck, lo, hi) {
    const nums = deck.cards.map(numOf).filter(n => n != null).sort((a, b) => a - b);
    return Math.abs(nums.indexOf(hi) - nums.indexOf(lo));
  }

  // ---------- wiring ----------
  const copyLink = async () => {
    const link = linkFor(roomCode);
    try { await navigator.clipboard.writeText(link); toast('招待リンクをコピーしました。チャットに貼って送ってください'); }
    catch { const i = $('linkView'); $('settingsDetails')?.setAttribute('open', ''); i.select(); try { document.execCommand('copy'); toast('コピーしました'); } catch { toast('下のリンクを長押しでコピーしてください'); } }
  };
  $('createBtn').addEventListener('click', createRoom);
  $('joinBtn').addEventListener('click', () => joinRoom($('joinCode').value, $('lobbyError'), $('joinBtn')));
  $('joinCode').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('joinBtn').click(); });
  $('joinLinkBtn').addEventListener('click', () => joinRoom($('joinFromLinkCode').textContent, $('joinLinkError'), $('joinLinkBtn')));
  $('nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') { if (!$('joinFromLink').hidden) $('joinLinkBtn').click(); else if ($('joinCode').value) $('joinBtn').click(); } });
  $('showChoicesBtn').addEventListener('click', () => { $('joinFromLink').hidden = true; $('choices').hidden = false; history.replaceState(null, '', location.pathname + location.search); });
  $('leaveBtn').addEventListener('click', leaveRoom);
  $('copyLink').addEventListener('click', copyLink);
  $('copyLink2').addEventListener('click', copyLink);
  $('revealBtn').addEventListener('click', () => act({ type: 'reveal' }));
  $('resetBtn').addEventListener('click', () => { myVoteLocal = null; act({ type: 'reset' }); });
  $('redoBtn').addEventListener('click', () => { myVoteLocal = null; act({ type: 'redo' }); });
  $('observerToggle').addEventListener('change', (e) => { myVoteLocal = null; act({ type: 'observer', value: e.target.checked }); });
  $('deckSelectRoom').addEventListener('change', (e) => { myVoteLocal = null; act({ type: 'deck', value: e.target.value }); });

  const openIssue = () => { $('issueView').hidden = true; $('issueEdit').hidden = false; const i = $('issueInput'); i.value = view ? view.issue : ''; i.focus(); };
  const closeIssue = (save) => { if (save) act({ type: 'issue', value: $('issueInput').value.trim() }); $('issueEdit').hidden = true; $('issueView').hidden = false; render(); };
  $('issueEditBtn').addEventListener('click', () => $('issueEdit').hidden ? openIssue() : closeIssue(true));
  $('issueView').addEventListener('click', openIssue);
  $('issueSaveBtn').addEventListener('click', () => closeIssue(true));
  $('issueInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') closeIssue(true); if (e.key === 'Escape') closeIssue(false); });

  window.addEventListener('beforeunload', () => { try { if (!isHost && hostConn && hostConn.open) hostConn.send({ type: 'leave' }); } catch {} });

  // opened from an invite link → show only the join box
  const hashCode = normCode(location.hash.slice(1));
  if (hashCode) {
    $('joinFromLink').hidden = false; $('choices').hidden = true;
    $('joinFromLinkCode').textContent = hashCode; $('joinCode').value = hashCode;
    if ($('nameInput').value.trim()) $('joinLinkBtn').focus(); else $('nameInput').focus();
  }
})();
</script>
</body>
</html>
